server {
    listen 80;
    server_name ${HTTP_PORTAL_DOMAIN}; # Replace with your actual domain or environment variable

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name ${HTTP_PORTAL_DOMAIN}; # Replace with your actual domain or environment variable

    ssl_certificate /var/lib/https-portal/yourdomain.com/fullchain.pem;
    ssl_certificate_key /var/lib/https-portal/yourdomain.com/privkey.pem;

    location / {
        proxy_pass http://frontend:${NEXT_PUBLIC_PORT}; # Ensure frontend is accessible at this port
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}